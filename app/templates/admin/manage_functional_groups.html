<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>จัดการหมู่ฟังก์ชัน | Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-top: 20px;
    }

    .admin-table th,
    .admin-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .admin-table th {
      background-color: #f8f9fa;
      color: #2c3e50;
    }

    .btn-action {
      padding: 5px 10px;
      border-radius: 5px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .btn-edit {
      background: #F1C40F;
      color: #000;
    }

    .btn-delete {
      background: #E74C3C;
      color: #fff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  {% include 'navbar.html' %}

  <div class="app-wrapper">
    <div class="admin-container" style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2><i class="fas fa-layer-group"></i> รายการหมู่ฟังก์ชันทั้งหมด</h2>
        <a href="#" class="action-btn"
          style="background: #2ECC71; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none;">
          <i class="fas fa-plus"></i> เพิ่มหมู่ฟังก์ชันใหม่
        </a>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>ชื่อ (EN)</th>
            <th>ชื่อ (TH)</th>
            <th>สูตรทั่วไป</th>
            <th>จำนวนสารเคมี</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody>
          {% for group in groups %}
          <tr>
            <td><strong>{{ group.name_en }}</strong></td>
            <td>{{ group.name_th }}</td>
            <td><code>{{ group.formula }}</code></td>
            <td>{{ group.chemical_count }} รายการ</td>
            <td>
              <a href="#" class="btn-action btn-edit"><i class="fas fa-edit"></i></a>
              <button class="btn-action btn-delete"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>

</html>
