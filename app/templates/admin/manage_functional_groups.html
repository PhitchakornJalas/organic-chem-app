<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>จัดการหมู่ฟังก์ชัน | Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
  {% include 'navbar.html' %}

  <div class="app-wrapper">
    <div class="admin-container" style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
      <div style="margin-bottom: 20px;">
        <a href="{{ url_for('admin_dashboard') }}"
          style="text-decoration: none; color: #666; font-weight: bold; display: flex; align-items: center; gap: 8px;">
          <i class="fas fa-arrow-left"></i> กลับไปหน้า Dashboard
        </a>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2><i class="fas fa-layer-group"></i> รายการหมู่ฟังก์ชันทั้งหมด</h2>
        <!-- <a href="#" class=""
          style="background: #2ECC71; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none;">
          <i class="fas fa-plus"></i> เพิ่มหมู่ฟังก์ชันใหม่
        </a> -->
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>ชื่อ (EN)</th>
            <th>ชื่อ (TH)</th>
            <th>สูตรทั่วไป</th>
            <th>จำนวนสารเคมี</th>
            <!-- <th>จัดการ</th> -->
          </tr>
        </thead>
        <tbody>
          {% for group in groups %}
          <tr>
            <td><strong>{{ group.name_en }}</strong></td>
            <td>{{ group.name_th }}</td>
            <td><code>{{ group.formula }}</code></td>
            <td>{{ group.chemical_count }} รายการ</td>
            <!-- <td>
              <a href="#" class="btn-action btn-edit"><i class="fas fa-edit"></i></a>
              <button class="btn-action btn-delete"><i class="fas fa-trash"></i></button>
            </td> -->
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>

</html>
