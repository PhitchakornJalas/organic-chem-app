<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>จัดการสารเคมี | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- SweetAlert2 CSS & JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>

<body>
  {% include 'navbar.html' %}

  <div class="app-wrapper">
    <div class="admin-container" style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">

      <!-- ปุ่มย้อนกลับ -->
      <div style="margin-bottom: 20px;">
        <a href="{{ url_for('admin_dashboard') }}"
          style="text-decoration: none; color: #666; font-weight: bold; display: flex; align-items: center; gap: 8px;">
          <i class="fas fa-arrow-left"></i> กลับไปหน้า Dashboard
        </a>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2><i class="fas fa-flask"></i> รายการสารเคมีทั้งหมด</h2>
        <a href="" class=""
          style="background: #2ECC71; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none;">
          <i class="fas fa-plus"></i> เพิ่มสารเคมีใหม่
        </a>
      </div>

      <div class="table-controls">
        <div>
          <label>ตัวกรองหมู่ฟังก์ชัน:</label>
          <select id="groupFilter" class="badge" style="padding: 8px; border: 1px solid #ddd;">
            <option value="">ทั้งหมด</option>
            <!-- <option value="ไม่ระบุ">ยังไม่ระบุหมู่ฟังก์ชัน</option> -->
            <!-- ดึงรายการหมู่ฟังก์ชันมาใส่ที่นี่ -->
          </select>
        </div>
      </div>

      <table id="chemTable" class="admin-table display">
        <thead>
          <tr>
            <th>IUPAC</th>
            <th>สูตรโมเลกุล</th>
            <th>หมู่ฟังก์ชัน</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody>
          {% for chem in chemicals %}
          <tr>
            <td><strong>{{ chem.IUPAC }}</strong></td>
            <td><code>{{ chem.molecularFormula }}</code></td>
            <td><code>{{ chem.name_en }}</code></td>
            <td>
              <a href="#" class="btn-action btn-edit"><i class="fas fa-edit"></i></a>
              <button class="btn-action btn-delete" onclick="confirmDelete('{{ chem.c_id }}', '{{ chem.IUPAC }}')">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>

<!-- เพิ่ม jQuery และ DataTables JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
  $(document).ready(function () {
    // 1. เริ่มต้นการทำงานของตาราง
    var table = $('#chemTable').DataTable({
      "pageLength": 10,  // ตั้งค่า Max Row เริ่มต้นที่ 10 แถว
      "lengthMenu": [[10, 25, 50, -1], [10, 25, 50, "ทั้งหมด"]], // ตัวเลือกเปลี่ยนจำนวนแถว
      "language": {
        "search": "ค้นหาด่วน:",
        "lengthMenu": "แสดง _MENU_ แถวต่อหน้า",
        "info": "แสดงรายการที่ _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ",
        "paginate": { "next": "ถัดไป", "previous": "ก่อนหน้า" }
      }
    });

    // 2. ระบบ Filter ตามหมู่ฟังก์ชัน (ดึงค่าจากคอลัมน์ที่ 3 หรือ index 2)
    $('#groupFilter').on('change', function () {
      var val = $(this).val();
      table.column(2).search(val).draw();
    });

    // 3. ดึงชื่อหมู่ฟังก์ชันที่มีอยู่ในตารางมาใส่ใน Select แบบอัตโนมัติ
    table.column(2).data().unique().sort().each(function (d, j) {
      var cleanName = $(d).text().trim();
      if (cleanName && cleanName !== 'ไม่ระบุ') {
        $('#groupFilter').append('<option value="' + cleanName + '">' + cleanName + '</option>');
      }
    });
  });
</script>

<script>
  function confirmDelete(id, name) {
    Swal.fire({
      title: 'ยืนยันการลบข้อมูล?',
      text: `คุณกำลังจะลบสาร "${name}" ออกจากระบบและไม่สามารถกู้คืนได้`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#E74C3C', // สีแดงตาม --admin-danger
      cancelButtonColor: '#666',
      confirmButtonText: 'ใช่, ลบเลย!',
      cancelButtonText: 'ยกเลิก',
      reverseButtons: true
    }).then((result) => {
      if (result.isConfirmed) {
        // ส่งคำขอไปยัง Backend
        fetch(`/admin/delete-chemical/${id}`, { method: 'POST' })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              Swal.fire({
                title: 'ลบข้อมูลสำเร็จ!',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
              }).then(() => {
                location.reload(); // โหลดหน้าใหม่เพื่ออัปเดตตาราง
              });
            }
          })
          .catch(err => {
            Swal.fire('เกิดข้อผิดพลาด!', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', 'error');
          });
      }
    });
  }
</script>

</html>
