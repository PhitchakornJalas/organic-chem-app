version: '3.8'

services:
  # ส่วนของฐานข้อมูล Neo4j
  neo4j:
    image: neo4j:latest
    container_name: neo4j_db
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol (สำหรับ Flask เชื่อมต่อ)
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    networks:
      - chem-network

  # ส่วนของ Web App (Flask)
  webapp:
    build: ./app
    container_name: flask_app
    ports:
      - "${FLASK_PORT}:5000"
    volumes:
      - ./app:/app  # <--- เพิ่มบรรทัดนี้: แมพโฟลเดอร์จากเครื่องเข้าไปใน Container
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=development  # <--- ช่วยให้ Flask รีโหลดตัวเองเมื่อโค้ดเปลี่ยน
      - FLASK_DEBUG=${FLASK_DEBUG}  # <--- เปิดโหมด Debug
    depends_on:
      - neo4j
    networks:
      - chem-network

networks:
  chem-network:
    driver: bridge